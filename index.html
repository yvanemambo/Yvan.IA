<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b20">
<title>Yvan.IA</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#100b20;color:#f5f1ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column;max-width:850px;padding:16px;margin-inline:auto}
header{text-align:center;padding:12px}h1{font-size:1.5rem;margin:0}h1 span{color:#a78bfa}
#messages{flex:1;min-height:45vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px 0}
.bubble{max-width:88%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.user{align-self:flex-end;background:#7045c7}.assistant{align-self:flex-start;background:#211a35}.error{align-self:center;color:#ff9ba8}
form{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}input{min-width:0;flex:1;background:#211a35;border:1px solid #49376d;color:white;border-radius:12px;padding:13px;font-size:16px}
button{border:0;border-radius:12px;padding:12px 16px;background:#8055d6;color:white;font-weight:600}button:disabled{opacity:.5}
#settings{margin:12px 0;color:#b9afd1;font-size:.9rem}#settings input{width:100%;margin-top:8px}
</style>
</head>
<body>
<header><h1>MBO<span>.IA</span></h1><p>Ton assistant intelligent personnel</p></header>
<main id="messages" aria-live="polite"><div class="bubble assistant">Bonjour ! Je suis Yvan.IA. Comment puis-je t'aider ?</div></main>
<div id="settings"><label for="access">Code d'accès</label><input id="access" type="password" autocomplete="current-password" placeholder="Entre ton code d'accès"></div>
<form id="chat"><input id="prompt" maxlength="8000" placeholder="Écris ton message…" autocomplete="off" required><button id="send">Envoyer</button></form>
<script>
const messages=document.querySelector("#messages"),form=document.querySelector("#chat"),promptInput=document.querySelector("#prompt"),send=document.querySelector("#send"),access=document.querySelector("#access");
let conversationId;
try{conversationId=localStorage.getItem("mbo-conversation")||crypto.randomUUID();localStorage.setItem("mbo-conversation",conversationId);access.value=sessionStorage.getItem("mbo-code")||""}catch(e){conversationId="mbo-session"}
access.addEventListener("change",()=>{try{sessionStorage.setItem("mbo-code",access.value)}catch(e){}});
function add(text,role){const el=document.createElement("div");el.className="bubble "+role;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
form.addEventListener("submit",async e=>{e.preventDefault();const text=promptInput.value.trim();if(!text||send.disabled)return;add(text,"user");promptInput.value="";send.disabled=true;send.textContent="…";
try{const response=await fetch("/commande",{method:"POST",headers:{"Content-Type":"application/json","X-Code":access.value,"X-Conversation-ID":conversationId},body:JSON.stringify({texte:text})});const data=await response.json();if(!response.ok||data.erreur)add(data.erreur||"Erreur serveur.","error");else add(data.reponse||"Réponse vide.","assistant")}
catch(err){add("Impossible de joindre Yvan.IA. Vérifie que le serveur fonctionne.","error")}
finally{send.disabled=false;send.textContent="Envoyer";promptInput.focus()}
});
</script>
</body></html>
