name: Vérifications Yvan.IA

on:
  push:
    branches: ["main", "corrections/**", "feature/studio-creatif-yvan-ia"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier le moteur vidéo
        run: node --check video-renderer/server.mjs
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q server.py
      - name: Exécuter les tests
        run: pytest -q
