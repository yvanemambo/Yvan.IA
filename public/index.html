<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0815">
<meta name="description" content="Yvan.IA, ton assistant intelligent personnel propulsé par Gemini.">
<title>Yvan.IA — Assistant intelligent</title>
<style>
:root{color-scheme:light;--bg:#f7f5f0;--surface:#fffefa;--surface-soft:#f0eee8;--line:#e8e4dc;--text:#292821;--muted:#77756d;--accent:#c56b45;--accent-dark:#a95132;--good:#477b61;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;justify-content:center}
.app{width:min(100%,1100px);min-height:100vh;display:flex;flex-direction:column;padding:0 34px}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.045em;font-size:1.2rem}
.logo{width:36px;height:36px;border-radius:12px;background:#292821;color:#fff;display:grid;place-items:center}
.logo svg{width:21px;height:21px}
.status{font-size:.75rem;color:var(--good);display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #dce8df;background:#f1f7f1;border-radius:999px}
.status.pending{color:#99723b;border-color:#eee2c8;background:#fbf6eb}.status.offline{color:#a44d45;border-color:#f0d8d3;background:#fbefed}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
main{width:100%;max-width:790px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.welcome{text-align:center;padding:clamp(55px,11vh,112px) 14px 35px}
.orb{width:58px;height:58px;border-radius:19px;margin:0 auto 25px;background:#eee7df;color:#a65d3f;display:grid;place-items:center}
.orb svg{width:30px;height:30px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2rem,5vw,3.15rem);letter-spacing:-.055em;line-height:1.12;margin:0;color:#302e28}
.welcome p{color:var(--muted);margin:15px auto 0;max-width:480px;line-height:1.75;font-size:.98rem}
#messages{flex:1;min-height:240px;display:flex;flex-direction:column;gap:23px;padding:24px 0 34px}
.message{display:flex;gap:13px;align-items:flex-start;max-width:100%;animation:appear .22s ease}
.message.user{flex-direction:row-reverse}
.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eeeae2;color:#625e54;font-size:.72rem;font-weight:750}
.user .avatar{background:#e9d6ca;color:#884b32}
.bubble{max-width:min(84%,700px);padding:13px 17px;border:1px solid #eae6de;border-radius:4px 16px 16px 16px;background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:.96rem}
.user .bubble{background:#eeeae2;border-color:#eeeae2;border-radius:16px 4px 16px 16px}
.error .bubble{background:#fbefed;border-color:#f0d8d3;color:#984b43}
.actions{display:flex;gap:8px;margin:7px 0 0 45px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:#77736a;border-radius:11px;padding:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s,color .18s}
.icon-btn:hover{border-color:#d8b6a5;background:#fbf5f0;color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.composer-wrap{position:sticky;bottom:0;padding:18px 0 max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%)}
.composer{background:var(--surface);border:1px solid #ded9cf;border-radius:19px;padding:11px;box-shadow:0 9px 30px #4d42300b;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#c88b70;box-shadow:0 0 0 3px #c56b4512,0 9px 30px #4d42300b}
#prompt{width:100%;resize:none;min-height:52px;max-height:160px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 11px;line-height:1.6}
#prompt::placeholder{color:#a19d93}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 0}
.left-controls,.right-controls{display:flex;align-items:center;gap:8px}
#send{border:0;border-radius:12px;background:#292821;color:white;padding:11px 17px;font-weight:650;cursor:pointer;display:flex;gap:9px;align-items:center;transition:background .18s,transform .18s}
#send:hover{background:#48453b;transform:translateY(-1px)}
#send:disabled{opacity:.55;cursor:wait;transform:none}
#send svg{width:16px;height:16px}
.small{font-size:.75rem;color:#928e84}
footer{text-align:center;color:#99958b;font-size:.72rem;padding:0 0 13px}
[hidden]{display:none!important}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:650px){.app{padding:0 15px}header{height:66px}.status{font-size:.68rem;padding:7px 9px}.welcome{padding-top:54px}.welcome p{font-size:.92rem}.bubble{max-width:89%;font-size:.93rem}.small{display:none}#send{padding:11px 13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z"/><path d="m19 2 .8 2.2L22 5l-2.2.8L19 8l-.8-2.2L16 5l2.2-.8L19 2Z"/></svg></div>Yvan<span style="color:#b99aff">.IA</span></div>
 <div class="status pending"><span class="dot"></span> Vérification…</div>
</header>
<main>
 <section class="welcome" id="welcome">
  <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M12 2.5 14.6 9.4 21.5 12l-6.9 2.6L12 21.5l-2.6-6.9L2.5 12l6.9-2.6L12 2.5Z"/><path d="m18.5 2 .7 1.8L21 4.5l-1.8.7L18.5 7l-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/></svg></div>
  <h1>Que veux-tu faire aujourd'hui ?</h1>
  <p>Pose-moi une question, demande-moi de t'expliquer quelque chose ou de t'aider dans ton travail.</p>
 </section>
 <section id="messages" aria-live="polite" aria-label="Historique de la conversation"></section>
 <div class="composer-wrap">
  <form class="composer" id="chat">
   <textarea id="prompt" rows="1" maxlength="8000" placeholder="Écris ton message à Yvan.IA…" aria-label="Ton message" required></textarea>
   <div class="controls">
    <div class="left-controls">
     <button class="icon-btn" type="button" id="mic" aria-label="Dicter un message" title="Dicter un message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5v4m-4 0h8"/></svg></button>
     <button class="icon-btn" type="button" id="clear" aria-label="Nouvelle conversation" title="Nouvelle conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
     <span class="small" id="voice-status">Dictée vocale selon ton navigateur</span>
    </div>
    <div class="right-controls"><button id="send" type="submit">Envoyer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-5 14-2-6-7-1Z"/></svg></button></div>
   </div>
  </form>
 </div>
</main>
</div>
<script>
const $=selector=>document.querySelector(selector);
const messages=$("#messages"),welcome=$("#welcome"),form=$("#chat"),promptInput=$("#prompt"),send=$("#send"),mic=$("#mic"),voiceStatus=$("#voice-status"),statusEl=$(".status");
const HISTORY_KEY="yvan-ia-history-v2";
let history=[];
try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");if(!Array.isArray(history))history=[];history=history.filter(item=>item&&["user","assistant"].includes(item.role)&&typeof item.text==="string").slice(-80);}catch(_){history=[];}
function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-80)));}catch(_){voiceStatus.textContent="Stockage local indisponible";}}
function addMessage(text,role,save=true){
 const wrap=document.createElement("article");wrap.className="message "+role;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"Vous":"Y";
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;
 wrap.append(avatar,bubble);messages.append(wrap);messages.scrollTop=messages.scrollHeight;
 if(save&&(role==="user"||role==="assistant")){history.push({role,text});saveHistory();}
 return bubble;
}
function renderHistory(){
 messages.replaceChildren();
 history.slice(-80).forEach(item=>addMessage(item.text,item.role,false));
 welcome.hidden=history.length>0;
}
renderHistory();
async function checkHealth(){
 try{
  const response=await fetch("/sante",{cache:"no-store"});
  if(!response.ok)throw new Error("health");
  const data=await response.json();
  const ready=Boolean(data.ready);
  statusEl.classList.toggle("pending",!ready);
  statusEl.classList.remove("offline");
  statusEl.lastChild.textContent=ready?"Gemini configuré":"Configuration requise";
 }catch(_){
  statusEl.classList.remove("pending");
  statusEl.classList.add("offline");
  statusEl.lastChild.textContent="Serveur inaccessible";
 }
}
checkHealth();
function resizeInput(){promptInput.style.height="auto";promptInput.style.height=Math.min(promptInput.scrollHeight,160)+"px";}
promptInput.addEventListener("input",resizeInput);
promptInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}});
$("#clear").addEventListener("click",()=>{
 if(!confirm("Commencer une nouvelle conversation ? L'historique local actuel sera effacé."))return;
 history=[];saveHistory();renderHistory();promptInput.focus();
});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 const recognition=new SpeechRecognition();recognition.lang="fr-FR";recognition.interimResults=true;recognition.continuous=false;
 let baseText="";
 mic.addEventListener("click",()=>{
  try{baseText=promptInput.value.trim();recognition.start();voiceStatus.textContent="Je t'écoute…";mic.style.color="#c4a7ff";}catch(_){voiceStatus.textContent="La dictée est déjà active.";}
 });
 recognition.onresult=event=>{
  let transcript="";for(let i=event.resultIndex;i<event.results.length;i++)transcript+=event.results[i][0].transcript;
  promptInput.value=(baseText?baseText+" ":"")+transcript;resizeInput();
 };
 recognition.onend=()=>{voiceStatus.textContent="Dictée terminée";mic.style.color="";};
 recognition.onerror=()=>{voiceStatus.textContent="Micro indisponible ou permission refusée";mic.style.color="";};
}else{mic.disabled=true;mic.title="La dictée vocale n'est pas prise en charge par ce navigateur";voiceStatus.textContent="Dictée non prise en charge";}
form.addEventListener("submit",async event=>{
 event.preventDefault();const text=promptInput.value.trim();if(!text||send.disabled)return;
 const previous=[];let historyBudget=20000;
 for(const item of history.slice(-16).reverse()){
  if(historyBudget<=0)break;
  const clipped=String(item.text||"").slice(-Math.min(4000,historyBudget));
  if(clipped){previous.unshift({role:item.role==="assistant"?"model":"user",text:clipped});historyBudget-=clipped.length;}
 }
 addMessage(text,"user");welcome.hidden=true;promptInput.value="";resizeInput();send.disabled=true;send.textContent="Réflexion…";
 const waiting=addMessage("Yvan.IA prépare une réponse…","assistant",false);
 try{
  const response=await fetch("/commande",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({texte:text,historique:previous})});
  const data=await response.json();
  waiting.textContent=response.ok&&!data.erreur?(data.reponse||"Réponse vide."):("Erreur : "+(data.erreur||"Le serveur n'a pas répondu correctement."));
  const role=response.ok&&!data.erreur?"assistant":"error";
  waiting.parentElement.className="message "+role;
  if(role==="assistant"){history.push({role:"assistant",text:waiting.textContent});saveHistory();}
 }catch(_){waiting.textContent="Impossible de joindre Yvan.IA. Vérifie ta connexion puis réessaie.";waiting.parentElement.className="message error";}
 finally{send.disabled=false;send.innerHTML='Envoyer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-5 14-2-6-7-1Z"/></svg>';promptInput.focus();messages.scrollTop=messages.scrollHeight;}
});
</script>
</body>
</html>
