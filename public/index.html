<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0815">
<meta name="description" content="Yvan.IA, ton assistant intelligent personnel propulsé par Gemini.">
<title>Yvan.IA — Assistant intelligent</title>
<style>
:root{color-scheme:dark;--bg:#080914;--panel:#111426;--panel2:#171b31;--line:#292d49;--text:#f5f5ff;--muted:#a4a8c2;--purple:#a78bfa;--cyan:#67e8f9;--good:#72e4bd;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);display:flex;justify-content:center;background:radial-gradient(ellipse at 12% 0%,#29205b88 0,transparent 35%),radial-gradient(ellipse at 92% 28%,#073b5480 0,transparent 32%),linear-gradient(145deg,#090a16,#0b1020 55%,#101025);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#a5a4ff .7px,transparent .7px);background-size:28px 28px;mask-image:linear-gradient(to bottom,#000,transparent 72%)}
.app{position:relative;width:min(100%,1160px);min-height:100vh;display:flex;flex-direction:column;padding:0 34px}
header{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12;gap:18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:-.045em;font-size:1.28rem}
.logo{width:42px;height:42px;border-radius:15px;background:linear-gradient(145deg,#c4b5fd,#8b5cf6 48%,#2563eb);display:grid;place-items:center;box-shadow:0 8px 32px #8b5cf655,inset 0 1px 0 #ffffff80;position:relative;overflow:hidden}
.logo:after{content:"";position:absolute;inset:-35%;background:linear-gradient(115deg,transparent 35%,#ffffff55 48%,transparent 60%);transform:translateX(-55%);animation:shine 7s ease-in-out infinite}
.logo svg{width:23px;height:23px;position:relative;z-index:1}
.status{font-size:.78rem;color:var(--good);display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid #72e4bd30;background:#72e4bd0b;border-radius:999px}
.status.pending{color:#f5d28b;border-color:#f5d28b30;background:#f5d28b0b}.status.offline{color:#ff9eae;border-color:#ff9eae30;background:#ff9eae0b}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
main{width:100%;max-width:900px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.welcome{text-align:center;padding:clamp(46px,9vh,100px) 12px 28px;position:relative}
.orb{width:88px;height:88px;border-radius:29px;margin:0 auto 25px;background:radial-gradient(circle at 28% 20%,#f0eaff,#a78bfa 34%,#6844c7 66%,#174c83);box-shadow:0 0 0 1px #ffffff30,0 15px 50px #8057ed55,0 0 90px #4f46e533;display:grid;place-items:center;position:relative;animation:float 5s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;inset:-10px;border:1px solid #a78bfa35;border-radius:35px;transform:rotate(12deg)}.orb:after{inset:-18px;border-color:#67e8f922;transform:rotate(-10deg)}
.orb svg{width:42px;height:42px;filter:drop-shadow(0 2px 8px #24104c)}
h1{font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.065em;line-height:1.08;margin:0;background:linear-gradient(100deg,#fff 15%,#d8ccff 55%,#8be7f5);background-clip:text;-webkit-background-clip:text;color:transparent}
.welcome p{color:var(--muted);margin:16px auto 0;max-width:530px;line-height:1.7;font-size:1rem}
#messages{flex:1;min-height:240px;display:flex;flex-direction:column;gap:20px;padding:18px 0 32px;scroll-behavior:smooth}
.message{display:flex;gap:12px;align-items:flex-start;max-width:100%;animation:appear .24s ease}.message.user{flex-direction:row-reverse}
.avatar{flex:0 0 36px;width:36px;height:36px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#272443,#202b49);border:1px solid #a78bfa30;color:#d8ccff;font-size:.76rem;font-weight:850;box-shadow:0 5px 18px #0003}
.user .avatar{background:linear-gradient(145deg,#8b5cf6,#3b82f6);border-color:#c4b5fd66;color:white}
.bubble{max-width:min(84%,760px);padding:15px 18px;border:1px solid #343653;border-radius:6px 19px 19px 19px;background:linear-gradient(145deg,#171a2d,#111426);box-shadow:0 12px 30px #0002;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.72;font-size:.96rem}
.user .bubble{background:linear-gradient(135deg,#6242b2,#394d9b);border-color:#9b83ee88;border-radius:19px 6px 19px 19px;color:#fff}
.error .bubble{background:#321b2b;border-color:#693344;color:#ffc0c7}
.actions{display:flex;gap:8px;margin:7px 0 0 48px}
.icon-btn{border:1px solid #343653;background:#171a2d;color:#aeb2ca;border-radius:12px;padding:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .18s ease}
.icon-btn:hover{border-color:var(--purple);color:white;background:#28213f;transform:translateY(-1px)}.icon-btn svg{width:17px;height:17px}
.composer-wrap{position:sticky;bottom:0;padding:18px 0 max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#0b0d1b 24%)}
.composer{background:linear-gradient(145deg,#171a2eec,#111426f2);border:1px solid #414363;border-radius:23px;padding:12px;box-shadow:0 22px 65px #0006,0 0 0 1px #ffffff08,inset 0 1px 0 #ffffff0d;backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#9b83ee;box-shadow:0 0 0 4px #8b5cf620,0 22px 65px #0006}
#prompt{width:100%;resize:none;min-height:54px;max-height:160px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:11px 12px;line-height:1.6}#prompt::placeholder{color:#858ba9}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 2px 0}.left-controls,.right-controls{display:flex;align-items:center;gap:9px}
#send{border:0;border-radius:14px;background:linear-gradient(120deg,#a78bfa,#7652dc 55%,#397bd8);color:white;padding:12px 19px;font-weight:780;cursor:pointer;display:flex;gap:9px;align-items:center;box-shadow:0 7px 22px #7652dc55;transition:transform .18s,filter .18s}
#send:hover{filter:brightness(1.12);transform:translateY(-1px)}#send:disabled{opacity:.6;cursor:wait;transform:none}#send svg{width:17px;height:17px}
.small{font-size:.76rem;color:#8990ad}
#access-panel{display:flex;justify-content:center;align-items:center;gap:10px;padding:0 0 13px;color:#a4a8c2;font-size:.8rem}
#access{width:170px;max-width:45vw;background:#111426;border:1px solid #343653;color:white;border-radius:11px;padding:9px 12px;outline:none}#access:focus{border-color:var(--purple)}
footer{text-align:center;color:#737b9b;font-size:.73rem;padding:0 0 15px;letter-spacing:.01em}
[hidden]{display:none!important}
@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes shine{0%,72%,100%{transform:translateX(-65%)}88%{transform:translateX(65%)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
@media(max-width:650px){.app{padding:0 15px}header{height:70px}.logo{width:38px;height:38px;border-radius:13px}.brand{font-size:1.15rem}.status{font-size:.69rem;padding:8px 10px}.welcome{padding:48px 5px 25px}.orb{width:76px;height:76px;border-radius:25px;margin-bottom:22px}.orb svg{width:36px;height:36px}h1{font-size:clamp(1.85rem,8vw,2.45rem)}.welcome p{font-size:.92rem}.bubble{max-width:89%;font-size:.93rem;padding:13px 15px}.avatar{flex-basis:33px;width:33px;height:33px}.small{display:none}.composer-wrap{padding-top:15px}#send{padding:11px 14px}}
@media(max-width:380px){.app{padding:0 10px}.status{font-size:.64rem}.left-controls,.right-controls{gap:6px}.icon-btn{padding:8px}#send{padding:10px 11px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z"/><path d="m19 2 .8 2.2L22 5l-2.2.8L19 8l-.8-2.2L16 5l2.2-.8L19 2Z"/></svg></div>Yvan<span style="color:#b99aff">.IA</span></div>
 <div class="status pending"><span class="dot"></span> Vérification…</div>
</header>
<main>
 <section class="welcome" id="welcome">
  <div class="orb"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"><path d="M12 2.5 14.6 9.4 21.5 12l-6.9 2.6L12 21.5l-2.6-6.9L2.5 12l6.9-2.6L12 2.5Z"/><path d="m18.5 2 .7 1.8L21 4.5l-1.8.7L18.5 7l-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/></svg></div>
  <h1>Que veux-tu faire aujourd'hui ?</h1>
  <p>Pose-moi une question, demande-moi de t'expliquer quelque chose ou de t'aider dans ton travail.</p>
 </section>
 <section id="messages" aria-live="polite" aria-label="Historique de la conversation"></section>
 <div class="composer-wrap">
  <form class="composer" id="chat">
   <textarea id="prompt" rows="1" maxlength="8000" placeholder="Écris ton message à Yvan.IA…" aria-label="Ton message" required></textarea>
   <div class="controls">
    <div class="left-controls">
     <button class="icon-btn" type="button" id="mic" aria-label="Dicter un message" title="Dicter un message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5v4m-4 0h8"/></svg></button>
     <button class="icon-btn" type="button" id="clear" aria-label="Nouvelle conversation" title="Nouvelle conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
     <span class="small" id="voice-status">Dictée vocale selon ton navigateur</span>
    </div>
    <div class="right-controls"><button id="send" type="submit">Envoyer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-5 14-2-6-7-1Z"/></svg></button></div>
   </div>
  </form>
 </div>
 <section id="access-panel"><label for="access">Code privé</label><input id="access" type="password" autocomplete="current-password" placeholder="Code d'accès"></section>
</main>
<footer>Yvan.IA · Propulsé par Gemini · Tes conversations sont enregistrées sur cet appareil</footer>
</div>
<script>
const $=selector=>document.querySelector(selector);
const messages=$("#messages"),welcome=$("#welcome"),form=$("#chat"),promptInput=$("#prompt"),send=$("#send"),access=$("#access"),mic=$("#mic"),voiceStatus=$("#voice-status"),statusEl=$(".status");
const HISTORY_KEY="yvan-ia-history-v2",CODE_KEY="yvan-ia-code";
let history=[];
try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");if(!Array.isArray(history))history=[];history=history.filter(item=>item&&["user","assistant"].includes(item.role)&&typeof item.text==="string").slice(-80);access.value=sessionStorage.getItem(CODE_KEY)||"";}catch(_){history=[];}
function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-80)));}catch(_){voiceStatus.textContent="Stockage local indisponible";}}
function addMessage(text,role,save=true){
 const wrap=document.createElement("article");wrap.className="message "+role;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"Vous":"Y";
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;
 wrap.append(avatar,bubble);messages.append(wrap);messages.scrollTop=messages.scrollHeight;
 if(save&&(role==="user"||role==="assistant")){history.push({role,text});saveHistory();}
 return bubble;
}
function renderHistory(){
 messages.replaceChildren();
 history.slice(-80).forEach(item=>addMessage(item.text,item.role,false));
 welcome.hidden=history.length>0;
}
renderHistory();
async function checkHealth(){
 try{
  const response=await fetch("/sante",{cache:"no-store"});
  if(!response.ok)throw new Error("health");
  const data=await response.json();
  const ready=Boolean(data.ready);
  statusEl.classList.toggle("pending",!ready);
  statusEl.classList.remove("offline");
  statusEl.lastChild.textContent=ready?"Gemini configuré":"Configuration requise";
 }catch(_){
  statusEl.classList.remove("pending");
  statusEl.classList.add("offline");
  statusEl.lastChild.textContent="Serveur inaccessible";
 }
}
checkHealth();
access.addEventListener("input",()=>{try{sessionStorage.setItem(CODE_KEY,access.value);}catch(_){}});
function resizeInput(){promptInput.style.height="auto";promptInput.style.height=Math.min(promptInput.scrollHeight,160)+"px";}
promptInput.addEventListener("input",resizeInput);
promptInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}});
$("#clear").addEventListener("click",()=>{
 if(!confirm("Commencer une nouvelle conversation ? L'historique local actuel sera effacé."))return;
 history=[];saveHistory();renderHistory();promptInput.focus();
});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 const recognition=new SpeechRecognition();recognition.lang="fr-FR";recognition.interimResults=true;recognition.continuous=false;
 let baseText="";
 mic.addEventListener("click",()=>{
  try{baseText=promptInput.value.trim();recognition.start();voiceStatus.textContent="Je t'écoute…";mic.style.color="#c4a7ff";}catch(_){voiceStatus.textContent="La dictée est déjà active.";}
 });
 recognition.onresult=event=>{
  let transcript="";for(let i=event.resultIndex;i<event.results.length;i++)transcript+=event.results[i][0].transcript;
  promptInput.value=(baseText?baseText+" ":"")+transcript;resizeInput();
 };
 recognition.onend=()=>{voiceStatus.textContent="Dictée terminée";mic.style.color="";};
 recognition.onerror=()=>{voiceStatus.textContent="Micro indisponible ou permission refusée";mic.style.color="";};
}else{mic.disabled=true;mic.title="La dictée vocale n'est pas prise en charge par ce navigateur";voiceStatus.textContent="Dictée non prise en charge";}
form.addEventListener("submit",async event=>{
 event.preventDefault();const text=promptInput.value.trim();if(!text||send.disabled)return;
 if(!access.value.trim()){addMessage("Entre ton code privé pour utiliser Yvan.IA.","error",false);access.focus();return;}
 const previous=[];let historyBudget=20000;
 for(const item of history.slice(-16).reverse()){
  if(historyBudget<=0)break;
  const clipped=String(item.text||"").slice(-Math.min(4000,historyBudget));
  if(clipped){previous.unshift({role:item.role==="assistant"?"model":"user",text:clipped});historyBudget-=clipped.length;}
 }
 addMessage(text,"user");welcome.hidden=true;promptInput.value="";resizeInput();send.disabled=true;send.textContent="Réflexion…";
 const waiting=addMessage("Yvan.IA prépare une réponse…","assistant",false);
 try{
  const response=await fetch("/commande",{method:"POST",headers:{"Content-Type":"application/json","X-Code":access.value},body:JSON.stringify({texte:text,historique:previous})});
  const data=await response.json();
  waiting.textContent=response.ok&&!data.erreur?(data.reponse||"Réponse vide."):("Erreur : "+(data.erreur||"Le serveur n'a pas répondu correctement."));
  const role=response.ok&&!data.erreur?"assistant":"error";
  waiting.parentElement.className="message "+role;
  if(role==="assistant"){history.push({role:"assistant",text:waiting.textContent});saveHistory();}
 }catch(_){waiting.textContent="Impossible de joindre Yvan.IA. Vérifie ta connexion puis réessaie.";waiting.parentElement.className="message error";}
 finally{send.disabled=false;send.innerHTML='Envoyer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-5 14-2-6-7-1Z"/></svg>';promptInput.focus();messages.scrollTop=messages.scrollHeight;}
});
</script>
</body>
</html>
