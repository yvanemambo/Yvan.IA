<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0815">
<meta name="description" content="Yvan.IA, ton assistant intelligent personnel propulsé par Gemini.">
<title>Yvan.IA — Assistant intelligent</title>
<style>
:root{color-scheme:light;--bg:#f7f5f0;--surface:#fffefa;--surface-soft:#f0eee8;--line:#e8e4dc;--text:#292821;--muted:#77756d;--accent:#c56b45;--accent-dark:#a95132;--good:#477b61;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:flex;justify-content:center}
.app{width:min(100%,1100px);min-height:100vh;display:flex;flex-direction:column;padding:0 34px}
header{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:16px}
.brand{display:flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.045em;font-size:1.2rem}
.logo{width:36px;height:36px;border-radius:12px;background:#292821;color:#fff;display:grid;place-items:center}
.logo svg{width:21px;height:21px}
.status{font-size:.75rem;color:var(--good);display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid #dce8df;background:#f1f7f1;border-radius:999px}
.status.pending{color:#99723b;border-color:#eee2c8;background:#fbf6eb}.status.offline{color:#a44d45;border-color:#f0d8d3;background:#fbefed}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
main{width:100%;max-width:790px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.welcome{text-align:center;padding:clamp(55px,11vh,112px) 14px 35px}
.orb{width:58px;height:58px;border-radius:19px;margin:0 auto 25px;background:#eee7df;color:#a65d3f;display:grid;place-items:center}
.orb svg{width:30px;height:30px}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(2rem,5vw,3.15rem);letter-spacing:-.055em;line-height:1.12;margin:0;color:#302e28}
.welcome p{color:var(--muted);margin:15px auto 0;max-width:480px;line-height:1.75;font-size:.98rem}
#messages{flex:1;min-height:240px;display:flex;flex-direction:column;gap:23px;padding:24px 0 34px}
.message{display:flex;gap:13px;align-items:flex-start;max-width:100%;animation:appear .22s ease}
.message.user{flex-direction:row-reverse}
.avatar{flex:0 0 32px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eeeae2;color:#625e54;font-size:.72rem;font-weight:750}
.user .avatar{background:#e9d6ca;color:#884b32}
.bubble{max-width:min(84%,700px);padding:13px 17px;border:1px solid #eae6de;border-radius:4px 16px 16px 16px;background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:.96rem}
.user .bubble{background:#eeeae2;border-color:#eeeae2;border-radius:16px 4px 16px 16px}
.error .bubble{background:#fbefed;border-color:#f0d8d3;color:#984b43}
.actions{display:flex;gap:8px;margin:7px 0 0 45px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:#77736a;border-radius:11px;padding:9px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s,color .18s}
.icon-btn:hover{border-color:#d8b6a5;background:#fbf5f0;color:var(--accent-dark)}
.icon-btn svg{width:17px;height:17px}
.composer-wrap{position:sticky;bottom:0;padding:18px 0 max(22px,env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 20%)}
.composer{background:var(--surface);border:1px solid #ded9cf;border-radius:19px;padding:11px;box-shadow:0 9px 30px #4d42300b;transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:#c88b70;box-shadow:0 0 0 3px #c56b4512,0 9px 30px #4d42300b}
#prompt{width:100%;resize:none;min-height:52px;max-height:160px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:10px 11px;line-height:1.6}
#prompt::placeholder{color:#a19d93}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 0}
.left-controls,.right-controls{display:flex;align-items:center;gap:8px}
#send{border:0;border-radius:12px;background:#292821;color:white;padding:11px 17px;font-weight:650;cursor:pointer;display:flex;gap:9px;align-items:center;transition:background .18s,transform .18s}
#send:hover{background:#48453b;transform:translateY(-1px)}
#send:disabled{opacity:.55;cursor:wait;transform:none}
#send svg{width:16px;height:16px}
.small{font-size:.75rem;color:#928e84}
footer{text-align:center;color:#99958b;font-size:.72rem;padding:0 0 13px}
[hidden]{display:none!important}

/* Compagnon anime Yvan.IA */
.anime-stage{height:176px;display:grid;place-items:center;margin:0 auto 18px;position:relative}
.anime-halo{width:148px;height:148px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#fff7ec 0%,#f3dfd1 52%,#ead3c8 70%,transparent 71%);animation:floatYvan 4s ease-in-out infinite}
.anime-halo:before,.anime-halo:after{content:"";position:absolute;border:1px solid #d99a78;border-radius:50%;inset:8px;animation:haloPulse 3s ease-in-out infinite}
.anime-halo:after{inset:-5px;border-color:#e8c5b1;animation-delay:1.5s}
.anime-face{width:112px;height:126px;position:relative;z-index:1}
.anime-face svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 9px #79533b20)}
.anime-eyes{transform-origin:center;animation:animeBlink 5s infinite}
.anime-spark{position:absolute;color:#c56b45;font-size:17px;animation:sparkle 2.5s ease-in-out infinite}
.anime-spark.one{top:20px;right:3px}.anime-spark.two{bottom:19px;left:4px;animation-delay:1.1s}
.anime-caption{font-size:.75rem;color:var(--muted);margin-top:-8px;letter-spacing:.02em}

/* Etats vivants du compagnon */

/* Mouvements expressifs et synchronisation vocale */
.anime-face{transform-origin:50% 55%;animation:faceBreath 4.2s ease-in-out infinite}
.anime-face svg{transform-origin:50% 55%}
.anime-stage[data-state="idle"] .anime-face{animation:faceBreath 4.2s ease-in-out infinite}
.anime-stage[data-state="listening"] .anime-face{animation:listenTilt 1.8s ease-in-out infinite}
.anime-stage[data-state="thinking"] .anime-face{animation:thinkTilt 2.6s ease-in-out infinite}
.anime-stage[data-state="speaking"] .anime-face{animation:speakBounce .32s ease-in-out infinite alternate}
.anime-stage[data-state="speaking"] #animeMouth{transform-box:fill-box;transform-origin:center;animation:mouthTalk .19s ease-in-out infinite alternate}
.anime-stage[data-state="speaking"] .anime-halo{animation:respondGlow .9s ease-in-out infinite alternate;box-shadow:0 0 0 10px #c56b4514,0 0 42px #c56b4560}
.anime-stage[data-state="listening"] .anime-spark{animation-duration:1.1s}
#animeMouth{transition:transform .12s}
#voice-toggle[aria-pressed="true"]{color:var(--accent-dark);border-color:#d8b6a5;background:#fbf5f0}
@keyframes faceBreath{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-2px) rotate(.7deg)}}
@keyframes listenTilt{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-2px)}}
@keyframes thinkTilt{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-3deg) translateY(-3px)}}
@keyframes speakBounce{from{transform:translateY(0) rotate(-.5deg)}to{transform:translateY(-2px) rotate(.5deg)}}
@keyframes mouthTalk{from{transform:scaleY(.55)}to{transform:scaleY(1.8)}}

.anime-stage[data-state="listening"] .anime-halo{animation:listenPulse 1.1s ease-in-out infinite;box-shadow:0 0 0 8px #c56b4510,0 0 34px #c56b4540}
.anime-stage[data-state="thinking"] .anime-halo{animation:thinkFloat 1.4s ease-in-out infinite;box-shadow:0 0 0 8px #c56b4510,0 0 38px #c56b4545}
.anime-stage[data-state="responding"] .anime-halo{animation:respondGlow .8s ease-in-out infinite alternate;box-shadow:0 0 0 10px #c56b4514,0 0 42px #c56b4560}
.anime-stage[data-state="listening"] .anime-face{transform:scale(1.04)}
.anime-stage[data-state="thinking"] .anime-eyes{animation:thinkEyes 1.4s ease-in-out infinite}
.anime-stage[data-state="responding"] .anime-face{animation:talkBounce .35s ease-in-out infinite alternate}
.anime-caption{transition:color .2s,transform .2s}
.anime-stage[data-state="listening"]+.anime-caption,.anime-stage[data-state="thinking"]+.anime-caption,.anime-stage[data-state="responding"]+.anime-caption{color:var(--accent-dark);transform:translateY(-2px)}
@keyframes listenPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes thinkFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(2deg)}}
@keyframes respondGlow{from{filter:saturate(1);transform:scale(1)}to{filter:saturate(1.35);transform:scale(1.06)}}
@keyframes thinkEyes{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(.75)}}
@keyframes talkBounce{from{transform:translateY(0)}to{transform:translateY(-2px)}}

@keyframes floatYvan{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes haloPulse{0%,100%{transform:scale(.98);opacity:.45}50%{transform:scale(1.05);opacity:.9}}
@keyframes animeBlink{0%,44%,48%,72%,76%,100%{transform:scaleY(1)}46%,74%{transform:scaleY(.08)}}
@keyframes sparkle{0%,100%{opacity:.35;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(18deg)}}
@media(prefers-reduced-motion:reduce){.anime-halo,.anime-halo:before,.anime-halo:after,.anime-eyes,.anime-spark{animation:none}}

@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:650px){.app{padding:0 15px}header{height:66px}.status{font-size:.68rem;padding:7px 9px}.welcome{padding-top:54px}.welcome p{font-size:.92rem}.bubble{max-width:89%;font-size:.93rem}.small{display:none}#send{padding:11px 13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Connexion et comptes personnels */
.auth-panel{width:min(100%,430px);margin:clamp(36px,8vh,82px) auto 30px;padding:26px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 48px #4d42300b}
.auth-panel h2{font-size:1.55rem;font-weight:600;letter-spacing:-.04em;margin:0 0 8px}
.auth-panel p{color:var(--muted);line-height:1.6;font-size:.9rem}
.auth-form{display:grid;gap:11px;margin-top:18px}
.auth-form input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);font:inherit;outline:none}
.auth-form input:focus{border-color:var(--accent)}
.auth-form button{border:0;border-radius:12px;background:#292821;color:white;padding:13px;font:inherit;font-weight:650;cursor:pointer}
.auth-form button:disabled{opacity:.55}
.auth-switch{display:flex;gap:8px;margin-top:13px}
.auth-switch button{background:transparent;border:0;color:var(--accent-dark);padding:6px 0;font:inherit;cursor:pointer}
.auth-error{min-height:1.3em;color:#a44d45;font-size:.85rem}
.auth-note{font-size:.78rem;color:var(--muted)}
.account-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 0;font-size:.8rem;color:var(--muted)}
.account-bar button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;color:var(--text);cursor:pointer}
body:not(.authenticated) #welcome,body:not(.authenticated) #messages,body:not(.authenticated) .composer-wrap{display:none}
body.authenticated #authPanel{display:none}
@media(max-width:600px){.auth-panel{margin-top:36px;padding:21px}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z"/><path d="m19 2 .8 2.2L22 5l-2.2.8L19 8l-.8-2.2L16 5l2.2-.8L19 2Z"/></svg></div>Yvan<span style="color:#b99aff">.IA</span></div>
 <div class="status pending"><span class="dot"></span> Vérification…</div>
</header>
<main>
 <section class="welcome" id="welcome">
  <div class="anime-stage" id="animeStage" data-state="idle" role="img" aria-label="Yvan, ton compagnon anime animé">
   <div class="anime-halo">
    <span class="anime-spark one">✦</span><span class="anime-spark two">✧</span>
    <div class="anime-face">
     <svg viewBox="0 0 120 136" xmlns="http://www.w3.org/2000/svg">
      <path d="M13 63C7 28 29 4 62 7c31 2 47 24 43 58l-8 51H24Z" fill="#292821"/>
      <path d="M27 57c0-27 14-42 34-42s34 15 34 42v29c0 25-15 40-34 40S27 111 27 86Z" fill="#d88f69"/>
      <path d="M22 59C15 27 36 7 63 9c22 1 39 15 40 43-9-7-16-17-19-27-11 14-31 22-61 21Z" fill="#292821"/>
      <path d="M27 42c-9 11-12 30-7 49 5-8 9-14 13-17M94 39c12 15 13 35 7 53-4-9-8-14-13-18" fill="none" stroke="#292821" stroke-width="10" stroke-linecap="round"/>
      <path d="M35 68c5-7 14-8 20-2" fill="none" stroke="#3b2926" stroke-width="3" stroke-linecap="round"/>
      <path d="M68 66c7-6 15-4 19 2" fill="none" stroke="#3b2926" stroke-width="3" stroke-linecap="round"/>
      <g class="anime-eyes" fill="#342329"><ellipse cx="46" cy="77" rx="5.2" ry="8"/><ellipse cx="76" cy="77" rx="5.2" ry="8"/><circle cx="48" cy="74" r="2" fill="#fff"/><circle cx="78" cy="74" r="2" fill="#fff"/></g>
      <path d="M56 91q4 4 8 0" fill="none" stroke="#a95162" stroke-width="2" stroke-linecap="round"/>
      <path id="animeMouth" d="M49 101q11 10 22 0" fill="none" stroke="#9d4c50" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M25 124q35-18 70 0v12H25Z" fill="#c56b45"/>
      <path d="M34 119 20 93M86 119l14-26" stroke="#292821" stroke-width="7" stroke-linecap="round"/>
      <path d="m60 111 4 7 8 1-6 5 1 8-7-4-7 4 1-8-6-5 8-1Z" fill="#f7c16b"/>
     </svg>
    </div>
   </div>
  </div>
  <div class="anime-caption" id="animeCaption">Yvan est prêt à t’aider</div>
  <h1>Que veux-tu faire aujourd'hui ?</h1>
  <p>Pose-moi une question, demande-moi de t'expliquer quelque chose ou de t'aider dans ton travail.</p>
 </section>
 <section id="messages" aria-live="polite" aria-label="Historique de la conversation"></section>
 <div class="account-bar"><span id="accountEmail"></span><button id="logoutButton" type="button">Se déconnecter</button></div>\n <div class="composer-wrap">
  <form class="composer" id="chat">
   <textarea id="prompt" rows="1" maxlength="8000" placeholder="Écris ton message à Yvan.IA…" aria-label="Ton message" required></textarea>
   <div class="controls">
    <div class="left-controls">
     <button class="icon-btn" type="button" id="voice-toggle" aria-label="Désactiver la voix de Yvan" aria-pressed="true" title="Voix activée"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg></button>
     <button class="icon-btn" type="button" id="mic" aria-label="Dicter un message" title="Dicter un message"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5v4m-4 0h8"/></svg></button>
     <button class="icon-btn" type="button" id="clear" aria-label="Nouvelle conversation" title="Nouvelle conversation"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg></button>
     <span class="small" id="voice-status">Dictée vocale selon ton navigateur</span>
    </div>
    <div class="right-controls"><button id="send" type="submit">Envoyer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-5 14-2-6-7-1Z"/></svg></button></div>
   </div>
  </form>
 </div>
</main>
</div>
<script>
const $=selector=>document.querySelector(selector);
const messages=$("#messages"),welcome=$("#welcome"),form=$("#chat"),promptInput=$("#prompt"),send=$("#send"),mic=$("#mic"),voiceStatus=$("#voice-status"),statusEl=$(".status");
const animeStage=$("#animeStage"),animeCaption=$("#animeCaption"),voiceToggle=$("#voice-toggle");\nconst authForm=$("#authForm"),authEmail=$("#authEmail"),authPassword=$("#authPassword"),authError=$("#authError"),authSubmit=$("#authSubmit"),authToggle=$("#authToggle");\nlet authMode="login",accessToken=sessionStorage.getItem("yvan-ia-access-token")||"";
let voiceEnabled=true;
function setAnimeState(state){
 if(!animeStage)return;
 animeStage.dataset.state=state;
 const labels={idle:"Yvan est prêt à t’aider",listening:"Yvan t’écoute…",thinking:"Yvan réfléchit avec Gemini…",responding:"Yvan te répond…",speaking:"Yvan te parle…"};
 if(animeCaption)animeCaption.textContent=labels[state]||labels.idle;
}
let historyKey="yvan-ia-history-v2:guest";\nlet currentUserId="";
const speechSupported="speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function speakReply(text){
 if(!voiceEnabled||!speechSupported||!text)return false;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="fr-FR";utterance.rate=1;utterance.pitch=1.04;utterance.volume=1;
 const voices=window.speechSynthesis.getVoices();
 const frenchVoice=voices.find(v=>/^fr(-|_)/i.test(v.lang)&&/google|microsoft|français|france/i.test(v.name))
  ||voices.find(v=>/^fr(-|_)/i.test(v.lang));
 if(frenchVoice)utterance.voice=frenchVoice;
 utterance.onstart=()=>{setAnimeState("speaking");voiceStatus.textContent="Yvan te parle…";};
 utterance.onboundary=()=>{if(animeStage)animeStage.dataset.voicebeat=String(Date.now());};
 utterance.onend=()=>{setAnimeState("idle");voiceStatus.textContent="Voix prête";};
 utterance.onerror=()=>{setAnimeState("idle");voiceStatus.textContent="Lecture vocale indisponible";};
 window.speechSynthesis.speak(utterance);
 return true;
}
if(!speechSupported){
 voiceEnabled=false;voiceToggle.disabled=true;voiceToggle.setAttribute("aria-pressed","false");
 voiceToggle.title="La lecture vocale n'est pas prise en charge par ce navigateur";
 voiceStatus.textContent="Voix non prise en charge";
}else{
 voiceToggle.addEventListener("click",()=>{
  voiceEnabled=!voiceEnabled;
  voiceToggle.setAttribute("aria-pressed",String(voiceEnabled));
  voiceToggle.title=voiceEnabled?"Voix activée":"Voix désactivée";
  voiceToggle.setAttribute("aria-label",voiceEnabled?"Désactiver la voix de Yvan":"Activer la voix de Yvan");
  if(!voiceEnabled){window.speechSynthesis.cancel();setAnimeState("idle");voiceStatus.textContent="Voix désactivée";}
  else voiceStatus.textContent="Voix activée";
 });
 window.speechSynthesis.getVoices();
}
let history=[];
try{history=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");if(!Array.isArray(history))history=[];history=history.filter(item=>item&&["user","assistant"].includes(item.role)&&typeof item.text==="string").slice(-80);}catch(_){history=[];}
function saveHistory(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-80)));}catch(_){voiceStatus.textContent="Stockage local indisponible";}}
function addMessage(text,role,save=true){
 const wrap=document.createElement("article");wrap.className="message "+role;
 const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"Vous":"Y";
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;
 wrap.append(avatar,bubble);messages.append(wrap);messages.scrollTop=messages.scrollHeight;
 if(save&&(role==="user"||role==="assistant")){history.push({role,text});saveHistory();}
 return bubble;
}
function renderHistory(){
 messages.replaceChildren();
 history.slice(-80).forEach(item=>addMessage(item.text,item.role,false));
 welcome.hidden=history.length>0;
}
renderHistory();
function setAuthMode(mode){
 authMode=mode;$("#authTitle").textContent=mode==="signup"?"Créer ton espace Yvan.IA":"Bienvenue sur Yvan.IA";
 $("#authDescription").textContent=mode==="signup"?"Ton espace sera privé et réservé à ton compte.":"Connecte-toi pour retrouver ton espace personnel et tes appareils.";
 authSubmit.textContent=mode==="signup"?"Créer mon compte":"Se connecter";
 authToggle.textContent=mode==="signup"?"J'ai déjà un compte":"Créer un compte";
 authPassword.autocomplete=mode==="signup"?"new-password":"current-password";
 authError.textContent="";
}
authToggle.addEventListener("click",()=>setAuthMode(authMode==="login"?"signup":"login"));
function setAuthenticated(user){
 document.body.classList.toggle("authenticated",Boolean(user));
 $("#accountEmail").textContent=user?"Connecté : "+(user.email||"compte Yvan.IA"):"";
 welcome.hidden=history.length>0;
}
async function checkSession(){
 if(!accessToken){setAuthenticated(null);return;}
 try{
  const response=await fetch("/auth/moi",{headers:{Authorization:"Bearer "+accessToken},cache:"no-store"});
  const data=await response.json();
  if(!response.ok)throw new Error("session");
  setAuthenticated(data.utilisateur);
 }catch(_){accessToken="";sessionStorage.removeItem("yvan-ia-access-token");setAuthenticated(null);}
}
authForm.addEventListener("submit",async event=>{
 event.preventDefault();authSubmit.disabled=true;authError.textContent="Connexion à Supabase…";
 const endpoint=authMode==="signup"?"/auth/inscription":"/auth/connexion";
 try{
  const response=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:authEmail.value.trim(),mot_de_passe:authPassword.value})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.erreur||"Impossible de continuer.");
  if(data.access_token){
   accessToken=data.access_token;sessionStorage.setItem("yvan-ia-access-token",accessToken);
   setAuthenticated({id:data.user?.id||"",email:data.user?.email||authEmail.value.trim()});authPassword.value="";authError.textContent="";
  }else if(authMode==="signup"){
   authError.textContent="Compte créé. Vérifie ta boîte e-mail pour confirmer ton adresse, puis connecte-toi.";
   setAuthMode("login");
  }else{throw new Error("La connexion n'a pas renvoyé de session valide.");}
 }catch(error){authError.textContent=error.message;}
 finally{authSubmit.disabled=false;}
});
$("#logoutButton").addEventListener("click",async()=>{
 if(accessToken){try{await fetch("/auth/deconnexion",{method:"POST",headers:{Authorization:"Bearer "+accessToken}});}catch(_){}}
 accessToken="";sessionStorage.removeItem("yvan-ia-access-token");setAuthenticated(null);setAuthMode("login");
});
async function checkHealth(){
 try{
  const response=await fetch("/sante",{cache:"no-store"});
  if(!response.ok)throw new Error("health");
  const data=await response.json();
  const ready=Boolean(data.gemini_configured);
  statusEl.classList.toggle("pending",!ready);
  statusEl.classList.remove("offline");
  statusEl.lastChild.textContent=!data.supabase_configured?"Comptes à configurer":(ready?"Gemini configuré":"Configuration requise");
 }catch(_){
  statusEl.classList.remove("pending");
  statusEl.classList.add("offline");
  statusEl.lastChild.textContent="Serveur inaccessible";
 }
}
checkHealth();\ncheckSession();
function resizeInput(){promptInput.style.height="auto";promptInput.style.height=Math.min(promptInput.scrollHeight,160)+"px";}
promptInput.addEventListener("input",resizeInput);
promptInput.addEventListener("keydown",event=>{if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}});
$("#clear").addEventListener("click",()=>{
 if(!confirm("Commencer une nouvelle conversation ? L'historique local actuel sera effacé."))return;
 history=[];saveHistory();renderHistory();promptInput.focus();
});
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){
 const recognition=new SpeechRecognition();recognition.lang="fr-FR";recognition.interimResults=true;recognition.continuous=false;
 let baseText="";
 mic.addEventListener("click",()=>{
  try{baseText=promptInput.value.trim();recognition.start();voiceStatus.textContent="Je t'écoute…";mic.style.color="#c56b45";setAnimeState("listening");}catch(_){voiceStatus.textContent="La dictée est déjà active.";}
 });
 recognition.onresult=event=>{
  let transcript="";for(let i=event.resultIndex;i<event.results.length;i++)transcript+=event.results[i][0].transcript;
  promptInput.value=(baseText?baseText+" ":"")+transcript;resizeInput();
 };
 recognition.onend=()=>{voiceStatus.textContent="Dictée terminée";mic.style.color="";setAnimeState("idle");};
 recognition.onerror=()=>{voiceStatus.textContent="Micro indisponible ou permission refusée";mic.style.color="";setAnimeState("idle");};
}else{mic.disabled=true;mic.title="La dictée vocale n'est pas prise en charge par ce navigateur";voiceStatus.textContent="Dictée non prise en charge";}
form.addEventListener("submit",async event=>{
 event.preventDefault();const text=promptInput.value.trim();if(!text||send.disabled)return;
 const previous=[];let historyBudget=20000;
 for(const item of history.slice(-16).reverse()){
  if(historyBudget<=0)break;
  const clipped=String(item.text||"").slice(-Math.min(4000,historyBudget));
  if(clipped){previous.unshift({role:item.role==="assistant"?"model":"user",text:clipped});historyBudget-=clipped.length;}
 }
 addMessage(text,"user");welcome.hidden=true;setAnimeState("thinking");promptInput.value="";resizeInput();send.disabled=true;send.textContent="Réflexion…";
 const waiting=addMessage("Yvan.IA prépare une réponse…","assistant",false);
 try{
  const response=await fetch("/commande",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},body:JSON.stringify({texte:text,historique:previous})});
  const data=await response.json();
  waiting.textContent=response.ok&&!data.erreur?(data.reponse||"Réponse vide."):("Erreur : "+(data.erreur||"Le serveur n'a pas répondu correctement."));
  const role=response.ok&&!data.erreur?"assistant":"error";
  waiting.parentElement.className="message "+role;
  if(role==="assistant"){
   history.push({role:"assistant",text:waiting.textContent});saveHistory();
   if(!speakReply(waiting.textContent))setAnimeState("responding");
  }else{setAnimeState("idle");}
 }catch(error){setAnimeState("idle");waiting.textContent=error.message||"Impossible de joindre Yvan.IA. Vérifie ta connexion puis réessaie.";waiting.parentElement.className="message error";}
 finally{if(!voiceEnabled||!speechSupported)setTimeout(()=>setAnimeState("idle"),2200);send.disabled=false;send.innerHTML='Envoyer <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 14-7-5 14-2-6-7-1Z"/></svg>';promptInput.focus();messages.scrollTop=messages.scrollHeight;}
});
</script>
